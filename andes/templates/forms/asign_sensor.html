{% extends "layouts/base-auth.html" %}
{% load static %}

{% block content %}
    <div class="flex flex-col items-center justify-center px-6 pt-8 mx-auto md:h-screen pt:mt-0 dark:bg-gray-900">
        <!-- Logo de Andes -->
        <a href="#" class="flex ml-2 md:mr-24">
            <!-- Imagen para modo claro -->
            <img id="logo-light" src="https://tinypic.host/images/2024/09/05/andes_tec.png" class="h-8 mr-3" alt="Andes Technologies" style="display: none;" />

            <!-- Imagen para modo oscuro -->
            <img id="logo-dark" src="https://tinypic.host/images/2024/09/05/andes.png" class="h-8 mr-3" alt="Andes Technologies" style="display: none;" />
        </a>

        <!-- Card -->
        <div class="w-full max-w-xl p-6 space-y-8 sm:p-8 bg-white rounded-lg shadow dark:bg-gray-800">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
                Asignar sensor
            </h2>
            <form method="post" class="mt-8 space-y-6">
                <!-- Seleccionar el sensor -->
                <div>
                    <label for="sensor" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Seleccione el sensor</label>
                    <select id="sensor" name="sensor" class="w-full p-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-primary-600">
                        <option value="sensor1">Sensor 1</option>
                        <option value="sensor2">Sensor 2</option>
                        <option value="sensor3">Sensor 3</option>
                    </select>
                </div>

                <!-- Capacidad (kg) -->
                <div>
                    <label for="capacidad" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Capacidad (kg)</label>
                    <input type="number" id="capacidad" name="capacidad" min="0" step="0.01" class="w-full p-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-primary-600">
                </div>

                <!-- Botón de enviar -->
                <button type="submit" class="w-full px-5 py-3 text-base font-medium text-center text-white bg-primary-700 rounded-lg hover:bg-primary-800 focus:ring-4 focus:ring-primary-300 sm:w-auto dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">Asignar</button>
            </form>
        </div>
    </div>
{% endblock content %}

{% block extra_js %}
<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function () {
    // Bugg desactivado: el logo no aparecía
    function toggleLogo() {
      const logoLight = document.getElementById('logo-light');
      const logoDark = document.getElementById('logo-dark');
      if (document.documentElement.classList.contains('dark')) {
        logoDark.style.display = 'block';  // Muestra el logo oscuro
        logoLight.style.display = 'none';  // Oculta el logo claro
      } else {
        logoLight.style.display = 'block'; // Muestra el logo claro
        logoDark.style.display = 'none';   // Oculta el logo oscuro
      }
    }
  
    // Llama a la función al cargar la página
    toggleLogo();
  
    // Observa cambios en el modo claro/oscuro
    const observer = new MutationObserver(toggleLogo);
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['class']
    });
  });
</script>
{% endblock %}
