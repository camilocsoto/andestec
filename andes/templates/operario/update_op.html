{% extends "layouts/base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto mt-8">
  <div class="p-4 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700 sm:p-6">

    <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Editar Operador</h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <!-- Nombre -->
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-200">Nombre</label>
        {{ form.first_name }}
      </div>

      <!-- Apellido -->
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-200">Apellido</label>
        {{ form.last_name }}
      </div>

      <!-- Tipo Documento -->
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-200">Tipo de Documento</label>
        {{ form.tipo_documento }}
      </div>

      <!-- Documento -->
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-200">Documento</label>
        {{ form.numDocumento }}
      </div>

      <!-- Cargo -->
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-200">Cargo</label>
        {{ form.cargo }}
      </div>

      <!-- Estado -->
      <div class="flex items-center gap-2">
        {{ form.estado }}
        <label class="text-sm font-medium text-gray-700 dark:text-gray-200">Activo</label>
      </div>

      <!-- Botones -->
      <div class="flex gap-3 mt-6">
        <button type="submit"
          class="px-4 py-2 rounded-lg bg-blue-200 text-gray-900 hover:bg-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-300
                 dark:bg-blue-600 dark:text-white dark:hover:bg-blue-700">
          Guardar cambios
        </button>
        <a href="{% url 'users:empList' %}"
          class="px-4 py-2 rounded-lg bg-gray-200 text-gray-900 hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-300
                 dark:bg-gray-600 dark:text-white dark:hover:bg-gray-700">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
