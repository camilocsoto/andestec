{% extends "layouts/base.html" %}
{% load static %}

{% block content %}
<main>
  <div class="px-4 pt-6">
    <!-- Bienvenida con nombre de usuario (admin) -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
        Bienvenido, {{ user_name }}
      </h1>
      <p class="mt-2 text-lg text-gray-600 dark:text-gray-300">
        Panel de control
      </p>
    </div>

    <div class="grid gap-6 sm:grid-cols-1 md:grid-cols-2 xl:grid-cols-3">

      <!-- Card: Empresas -->
      <a href="{% url 'users:FactList' %}" class="block p-6 bg-white border border-gray-200 rounded-lg shadow hover:shadow-lg dark:bg-gray-800 dark:border-gray-700">
        <div class="flex flex-col items-center text-center">
          <!-- Icono 👤 (gris en light, gris-claro en dark) -->
          <svg class="w-12 h-12 mb-4 text-gray-500 dark:text-gray-400" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8V22h19.2v-2.8c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
          <h5 class="mb-2 text-xl font-bold text-gray-900 dark:text-white">Empresas</h5>
          <p class="text-gray-500 dark:text-gray-400">Gestión de usuarios autorizados para el uso de nuestros servicios</p>
        </div>
      </a>

      <!-- Card: Monitorear -->
      <a href="#" class="block p-6 bg-white border border-gray-200 rounded-lg shadow hover:shadow-lg dark:bg-gray-800 dark:border-gray-700">
        <div class="flex flex-col items-center text-center">
          <!-- Icono 📊 -->
          <svg class="w-12 h-12 mb-4 text-gray-500 dark:text-gray-400" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 13h2v8H3v-8zm4-6h2v14H7V7zm4 4h2v10h-2V11zm4-8h2v18h-2V3zm4 12h2v6h-2v-6z"/>
          </svg>
          <h5 class="mb-2 text-xl font-bold text-gray-900 dark:text-white">Monitorear</h5>
          <p class="text-gray-500 dark:text-gray-400">Supervisión de procesos y métricas</p>
        </div>
      </a>

      <!-- Card: PQRS -->
      <a href="#" class="block p-6 bg-white border border-gray-200 rounded-lg shadow hover:shadow-lg dark:bg-gray-800 dark:border-gray-700">
        <div class="flex flex-col items-center text-center">
          <!-- Icono 📨 -->
          <svg class="w-12 h-12 mb-4 text-red-500 dark:text-red-400" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.89 2 1.99 2H20a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          <h5 class="mb-2 text-xl font-bold text-gray-900 dark:text-white">PQRS</h5>
          <p class="text-gray-500 dark:text-gray-400">Peticiones, quejas y reclamos</p>
        </div>
      </a>

    </div>
  </div>
</main>
{% endblock %}
